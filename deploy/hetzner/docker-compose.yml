# Yuvomi hinter Caddy auf einem einzelnen Mietserver (Hetzner Cloud o. ä.).
#
# Zwei Container: Yuvomi selbst und Caddy als Reverse Proxy, der Zertifikate
# von Let's Encrypt automatisch holt und erneuert. Yuvomi veröffentlicht keinen
# Port am Host; nur Caddy ist von außen erreichbar (80 und 443).
#
# Alle Werte kommen aus der .env neben dieser Datei (siehe .env.example und
# bootstrap.sh). Für den eigenen Fork später YUVOMI_IMAGE in der .env umstellen.

services:
  yuvomi:
    image: ${YUVOMI_IMAGE:-ghcr.io/ulsklyc/yuvomi:latest}
    container_name: yuvomi
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ${MODULES_DIR:-./modules}:/app/modules
      - ${DOCUMENT_STORAGE_LOCAL_DIR:-./documents}:${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=${DB_PATH:-/data/yuvomi.db}
      - BACKUP_DIR=/backups
      - MODULES_DIR=/app/modules
      - DOCUMENT_STORAGE_LOCAL_ENABLED=${DOCUMENT_STORAGE_LOCAL_ENABLED:-false}
      - DOCUMENT_STORAGE_LOCAL_PATH=${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}
      # Hinter Caddy immer sichere Cookies und genau ein vertrauter Proxy-Hop.
      - SESSION_SECURE=true
      - TRUST_PROXY=1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: yuvomi-caddy
    restart: unless-stopped
    depends_on:
      - yuvomi
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN fehlt in .env}
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
